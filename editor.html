<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>戦車道RTS エディタ</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body class="editor">
  <header id="ed-top">
    <span class="brand">戦車道RTS エディタ</span>
    <nav id="tabs"></nav>
    <span class="spacer"></span>
    <span id="dirty" class="hidden">未保存の変更あり</span>
    <button id="btn-check">確認中…</button>
  </header>
  <div id="ed-tools">
    <button id="btn-save-browser" class="primary" title="このブラウザに保存。ゲームを開き直すと反映されます">ブラウザに保存</button>
    <button id="btn-save-folder" title="プロジェクトのフォルダ（または data フォルダ）を選ぶと、data/*.json と選んだ画像を書き込みます">data フォルダに保存</button>
    <button id="btn-export-one" title="今のタブのデータを tanks.json などとしてダウンロード">このタブを書き出し</button>
    <button id="btn-export-all" title="全データを1つのファイルにまとめてダウンロード">全部まとめて書き出し</button>
    <button id="btn-import">読み込み</button>
    <input id="file-import" type="file" accept=".json,application/json" class="hidden">
    <button id="btn-reload">data フォルダから読み直す</button>
    <a class="btn-link" href="index.html" target="_blank">ゲームを開く</a>
    <span id="status"></span>
  </div>
  <div id="check-panel" class="hidden"></div>
  <div id="ed-main">
    <aside id="list"></aside>
    <section id="form"></section>
  </div>
  <script type="module" src="js/editor.js"></script>
</body>
</html>
